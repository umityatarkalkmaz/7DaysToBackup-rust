name: Build and Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      # NOTE: negation ('!foo') is not honoured inside paths-ignore. The Python
      # repo had '**.txt' with a '!requirements.txt' exception here, which also
      # matched requirements.txt and made dependency bumps produce no release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ci.yml runs on pull requests only, so a direct push to main would otherwise
  # reach a release without ever being linted. One cached ubuntu job keeps that
  # gate in place; the test matrix below is the gate that blocks publishing.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `asset` is what cargo produces; `release_name` is what it is published
        # as. They have to differ because Linux and macOS both build a file
        # literally named `seven-days-to-backup`, and GitHub release asset names
        # must be unique — in the Python repo one silently replaced the other
        # and Linux users got no binary at all for a release. The suffix also
        # tells a downloader which build they are getting.
        #
        # Every asset is compressed. Linux and macOS have to be: release assets
        # are plain blobs, GitHub does not carry file modes, so a bare Unix
        # binary arrives without its executable bit — and with no extension
        # either, macOS Finder took it for a text document and opened it in
        # TextEdit. tar records the mode, so extracting restores it.
        #
        # Windows does not have that problem, but the download is worth halving
        # all the same. zip rather than tar.gz: Explorer opens it on a
        # double-click without any extra tool.
        #
        # macOS ships a .app bundle, so double-clicking it launches the program
        # instead of opening a Terminal window alongside it, and so it can carry
        # an icon. Bundles are distributed as zip built with `ditto`, the
        # platform's own tool for the job.
        include:
          - os: ubuntu-latest
            asset: seven-days-to-backup
            binary_name: 7DaysToBackup
            release_name: 7DaysToBackup-rust-linux.tar.gz
          - os: windows-latest
            asset: seven-days-to-backup.exe
            binary_name: 7DaysToBackup.exe
            release_name: 7DaysToBackup-rust-windows.zip
          - os: macos-latest
            asset: seven-days-to-backup
            binary_name: 7DaysToBackup
            release_name: 7DaysToBackup-rust-macos.zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The release is only worth publishing if it passes the same gates CI
      # runs; a push to main triggers both workflows independently.
      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out stage

          if [ "${{ runner.os }}" = "macOS" ]; then
            APP="stage/${{ matrix.binary_name }}.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "target/release/${{ matrix.asset }}" "$APP/Contents/MacOS/${{ matrix.binary_name }}"
            chmod +x "$APP/Contents/MacOS/${{ matrix.binary_name }}"

            # iconutil wants an .iconset of exactly these names. Each size is
            # rendered from assets/icon.svg rather than downscaled from one
            # bitmap, so the small ones stay crisp.
            ICONSET=stage/AppIcon.iconset
            mkdir -p "$ICONSET"
            cp assets/icon-16.png   "$ICONSET/icon_16x16.png"
            cp assets/icon-32.png   "$ICONSET/icon_16x16@2x.png"
            cp assets/icon-32.png   "$ICONSET/icon_32x32.png"
            cp assets/icon-64.png   "$ICONSET/icon_32x32@2x.png"
            cp assets/icon-128.png  "$ICONSET/icon_128x128.png"
            cp assets/icon-256.png  "$ICONSET/icon_128x128@2x.png"
            cp assets/icon-256.png  "$ICONSET/icon_256x256.png"
            cp assets/icon-512.png  "$ICONSET/icon_256x256@2x.png"
            cp assets/icon-512.png  "$ICONSET/icon_512x512.png"
            cp assets/icon-1024.png "$ICONSET/icon_512x512@2x.png"
            iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

            VERSION=$(date +'%Y.%m.%d')
            cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>${{ matrix.binary_name }}</string>
            <key>CFBundleIdentifier</key><string>com.umityatarkalkmaz.7daystobackup</string>
            <key>CFBundleName</key><string>7 Days To Backup</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

            # Apple Silicon refuses to run an unsigned binary at all. cargo's
            # output carries the linker's ad-hoc signature, but assembling the
            # bundle around it means the bundle itself must be signed too.
            codesign --force --sign - "$APP"

            # ditto rather than zip: it is the platform's own tool and carries
            # bundle permissions and extended attributes correctly.
            ditto -c -k --sequesterRsrc --keepParent "$APP" "out/${{ matrix.release_name }}"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/release/${{ matrix.asset }}" "stage/${{ matrix.binary_name }}"
            # 7-Zip is bundled with the runner. Invoked from inside `stage` so
            # the entry lands at the archive root: given a path argument it
            # would store `stage/...` and the user would extract a folder.
            (cd stage && 7z a -tzip "../out/${{ matrix.release_name }}" "${{ matrix.binary_name }}")

          else
            cp "target/release/${{ matrix.asset }}" "stage/${{ matrix.binary_name }}"
            # cargo already marks it executable; setting it explicitly means the
            # tarball is correct even if that ever stops being true.
            chmod +x "stage/${{ matrix.binary_name }}"
            tar -czf "out/${{ matrix.release_name }}" -C stage "${{ matrix.binary_name }}"
          fi

      # These guard failures that are silent at build time and only surface on a
      # user's machine: a binary that will not start, an archive that extracts a
      # folder instead of a program, or a bundle macOS refuses to open.
      - name: Verify the archive
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows)
              entries=$(7z l -ba "out/${{ matrix.release_name }}" | awk '{print $NF}')
              echo "entries: $entries"
              if [ "$entries" != "${{ matrix.binary_name }}" ]; then
                echo "::error::expected exactly '${{ matrix.binary_name }}' at the archive root, got: $entries"
                exit 1
              fi
              ;;
            macOS)
              # Unpack what the user will actually download, not the staging copy.
              rm -rf check && mkdir check
              ditto -x -k "out/${{ matrix.release_name }}" check
              APP="check/${{ matrix.binary_name }}.app"
              BIN="$APP/Contents/MacOS/${{ matrix.binary_name }}"
              test -d "$APP"                             || { echo "::error::bundle missing"; exit 1; }
              test -x "$BIN"                             || { echo "::error::bundle executable missing or not executable"; exit 1; }
              test -f "$APP/Contents/Info.plist"         || { echo "::error::Info.plist missing"; exit 1; }
              test -f "$APP/Contents/Resources/AppIcon.icns" || { echo "::error::icon missing"; exit 1; }
              # Apple Silicon will not run unsigned code at all, so an invalid
              # signature means an app that cannot open on any current Mac.
              codesign --verify --strict --verbose=2 "$APP"
              plutil -lint "$APP/Contents/Info.plist"
              file "$BIN"
              ;;
            *)
              mode=$(tar -tvzf "out/${{ matrix.release_name }}" | awk 'NR==1 {print $1}')
              echo "mode: $mode"
              case "$mode" in
                *x*) ;;
                *) echo "::error::archived binary is not executable ($mode)"; exit 1 ;;
              esac
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.release_name }}
          path: out/${{ matrix.release_name }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Compute release tag
        id: tag
        run: echo "TAG_NAME=v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Show what will be released
        run: find artifacts -type f -printf '%s\t%p\n' | sort -rn

      # fail_on_unmatched_files below does not protect against two matched files
      # sharing an asset name — that collision is silent. This check does.
      - name: Check every platform produced a distinct asset
        run: |
          total=$(find artifacts -type f | wc -l)
          unique=$(find artifacts -type f -printf '%f\n' | sort -u | wc -l)
          echo "$total file(s), $unique distinct name(s)"
          if [ "$total" -ne 3 ] || [ "$unique" -ne 3 ]; then
            echo "::error::Expected 3 files with 3 distinct names; duplicates are"
            echo "::error::silently dropped when uploaded as release assets."
            find artifacts -type f -printf '%f\n' | sort | uniq -d
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/7DaysToBackup-rust-linux.tar.gz/7DaysToBackup-rust-linux.tar.gz
            artifacts/7DaysToBackup-rust-windows.zip/7DaysToBackup-rust-windows.zip
            artifacts/7DaysToBackup-rust-macos.zip/7DaysToBackup-rust-macos.zip
