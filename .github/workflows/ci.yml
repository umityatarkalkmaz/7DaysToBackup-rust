name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      # NOTE: negation ('!foo') is not honoured inside paths-ignore. The Python
      # repo learned this the hard way — a '**.txt' entry with a
      # '!requirements.txt' exception silently skipped every dependency bump.
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # eframe links against these; clippy --all-targets compiles the binary
      # target too, so they are needed even though no window is ever opened.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      # Three platforms because paths.rs and platform.rs branch per OS. The
      # per-OS unit tests are host-independent by design (the Os enum is a
      # parameter), but the default-path helpers still read real environment
      # variables, and only the real runner proves those.
      - name: Test
        run: cargo test --all-features
